name: CI

on:
  push:
    branches: [main]
  pull_request:

# Varsayılan token yetkisi yalnızca okuma: workflow'un ihtiyacı olan tek şey kodu çekmek.
permissions:
  contents: read

# Aynı dalda yeni bir push gelince eski koşuyu iptal et.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# API anahtarları sahte: testler dış servislere gitmez (respx/sahte istemciler), ama
# Settings bu alanlar olmadan açılmaz. Gerçek anahtar ya da sır bu dosyaya girmez.
env:
  PLACES_API_KEY: ci-sahte
  GEOCODING_API_KEY: ci-sahte
  ROUTES_API_KEY: ci-sahte
  GROQ_API_KEY: ci-sahte
  JWT_SECRET: ci-icin-sahte-jwt-anahtari-en-az-32-karakter

jobs:
  gitleaks:
    # Push/PR'daki yeni commit'leri tarar (tam geçmişi değil); bilerek sahte/test
    # amaçlı değerler (ör. test JWT_SECRET'leri) .gitleaksignore'da fingerprint'leriyle
    # işaretli, CI'ı kırmaz. Yeni bir fingerprint eklemeden önce değerin gerçekten
    # sahte olduğundan emin ol.
    name: Sır taraması (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Testler (bellek içi SQLite; Postgres gerekmez)
        run: pytest

  migrations:
    # Testler SQLite'ta koşar; şemanın GERÇEK Postgres'te de kurulduğunu, modellerle
    # uyuştuğunu ve geri alınabildiğini burada doğrularız.
    name: Migration'lar (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rota
          POSTGRES_PASSWORD: rota
          POSTGRES_DB: rota
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rota -d rota"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://rota:rota@localhost:5432/rota
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Boş veritabanına uygula
        run: alembic upgrade head
      - name: Modeller ile migration'lar uyuşuyor mu?
        run: alembic check
      - name: Geri al ve yeniden uygula
        run: |
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Vite 8 ve oxlint Node ^20.19 || >=22.12 ister; eski Node'da `npm ci` bu paketlerin
          # yerel (native) bağlamalarını SESSİZCE atlar ve lint/build "Cannot find native
          # binding" ile patlar. Bu yüzden belirsiz "20" değil açık bir sürüm.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tip kontrolü
        run: npx tsc -b --noEmit
      - name: Testler (Vitest)
        run: npm test
      - name: Build
        run: npm run build
