# Yerel geliştirme: `docker compose up -d db` yalnızca Postgres'i başlatır.
# `docker compose up --build` backend'i de konteynerde çalıştırır.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}
      POSTGRES_DB: ${POSTGRES_DB:-rota}
    ports:
      # Yalnızca localhost'a açık: dışarıdan erişilemesin.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rota} -d ${POSTGRES_DB:-rota}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Konteyner içinden DB'ye servis adıyla (db) bağlanılır.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rota}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rota}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
