[project]
name = "rota-app"
version = "0.1.0"
description = "Grup aktivite ve rota planlama uygulaması"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "pydantic-settings",
    "httpx",
    "groq",
    "slowapi",
    "pyjwt[crypto]",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "argon2-cffi",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "aiosqlite",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic'in ürettiği migration dosyaları elle biçimlendirilmez.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Uzun satırlar LLM prompt metinleri: bölmek prompt'u (ve çıktıyı) değiştirir.
"app/services/planner.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"